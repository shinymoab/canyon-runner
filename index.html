<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#150e14">
<title>Canyon Runner</title>
<style>
  :root{
    --ink:#150e14;
    --amber:#f5c45e;
    --bone:#ede6da;
    --alarm:#e2574c;
    --display:"Avenir Next Condensed","Helvetica Neue",Impact,sans-serif;
    --data:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --pad-t:env(safe-area-inset-top,0px);
    --pad-b:env(safe-area-inset-bottom,0px);
    --pad-l:env(safe-area-inset-left,0px);
    --pad-r:env(safe-area-inset-right,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;position:fixed;inset:0;background:var(--ink);
    color:var(--bone);font-family:var(--data);touch-action:none;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none}
  canvas{display:block;position:absolute;inset:0}

  #hud{position:absolute;inset:0;pointer-events:none;
    padding:calc(var(--pad-t) + 14px) calc(var(--pad-r) + 14px) calc(var(--pad-b) + 14px) calc(var(--pad-l) + 14px)}
  .hidden{display:none !important}

  #telemetry{position:absolute;top:calc(var(--pad-t) + 14px);left:calc(var(--pad-l) + 16px)}
  .eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--amber);opacity:.85}
  #levelName{font-family:var(--display);font-size:26px;letter-spacing:.06em;
    text-transform:uppercase;line-height:1.05;margin-top:2px}
  #clock{font-size:13px;letter-spacing:.14em;opacity:.72;margin-top:4px}

  #attitude{position:absolute;top:calc(var(--pad-t) + 12px);left:50%;transform:translateX(-50%);
    width:190px;height:96px;opacity:.9}
  #attitude svg{width:100%;height:100%;overflow:visible}

  #rail{position:absolute;right:calc(var(--pad-r) + 16px);top:50%;transform:translateY(-50%);
    width:3px;height:38vh;max-height:280px;background:rgba(237,230,218,.16);border-radius:2px}
  #railFill{position:absolute;left:0;bottom:0;width:100%;height:0%;
    background:linear-gradient(to top,rgba(237,230,218,.5),var(--amber));border-radius:2px}
  #railHead{position:absolute;right:9px;bottom:0;transform:translateY(50%);
    font-size:10px;letter-spacing:.14em;color:var(--amber);white-space:nowrap}
  #railLabel{position:absolute;right:0;top:-22px;font-family:var(--display);font-size:10px;
    letter-spacing:.28em;text-transform:uppercase;opacity:.6}

  #stickZone{position:absolute;left:0;bottom:0;width:52%;height:56%;pointer-events:auto}
  #stickBase{position:absolute;width:132px;height:132px;border-radius:50%;
    border:1px solid rgba(237,230,218,.22);background:rgba(21,14,20,.28);
    left:calc(var(--pad-l) + 26px);bottom:calc(var(--pad-b) + 30px);
    display:flex;align-items:center;justify-content:center}
  #stickBase::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;
    background:rgba(237,230,218,.3)}
  #stickKnob{width:56px;height:56px;border-radius:50%;background:rgba(245,196,94,.16);
    border:1.5px solid var(--amber);position:absolute;
    box-shadow:0 0 22px rgba(245,196,94,.25)}

  #boost{position:absolute;right:calc(var(--pad-r) + 26px);bottom:calc(var(--pad-b) + 40px);
    width:96px;height:96px;border-radius:50%;pointer-events:auto;
    border:1px solid rgba(245,196,94,.45);background:rgba(245,196,94,.08);
    font-family:var(--display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--amber);display:flex;align-items:center;justify-content:center}
  #boost.on{background:rgba(245,196,94,.3);box-shadow:0 0 34px rgba(245,196,94,.4)}
  #boost.dry{opacity:.35}
  #speedBox{position:absolute;right:calc(var(--pad-r) + 26px);bottom:calc(var(--pad-b) + 150px);
    width:96px;text-align:center}
  #speed{font-family:var(--display);font-size:30px;letter-spacing:.02em;line-height:1}
  #speedUnit{font-size:9px;letter-spacing:.28em;opacity:.55;text-transform:uppercase}

  .meterBar{margin-top:9px;height:3px;background:rgba(237,230,218,.16);border-radius:2px;overflow:hidden}
  .meterFill{height:100%;width:0%;background:var(--amber)}

  #vignette{position:absolute;inset:0;opacity:0;pointer-events:none;
    box-shadow:inset 0 0 120px 20px rgba(226,87,76,.75)}

  #launchZone{position:absolute;inset:0;pointer-events:auto}
  #launchHint{position:absolute;top:calc(var(--pad-t) + 14px);left:50%;transform:translateX(-50%);
    text-align:center;font-family:var(--display);font-size:12px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--amber);opacity:.85}
  #launchPad{position:absolute;left:50%;top:60%;width:14px;height:14px;border-radius:50%;
    border:1.5px solid rgba(237,230,218,.4);transform:translate(-50%,-50%)}
  #launchTrajSvg{position:absolute;inset:0;overflow:visible;pointer-events:none}
  #launchMeterBox{position:absolute;left:50%;bottom:calc(var(--pad-b) + 40px);
    transform:translateX(-50%);width:200px;text-align:center}
  #launchMeterBox .meterBar{height:5px}

  #panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 40%,rgba(21,14,20,.6),rgba(21,14,20,.94));
    pointer-events:auto;padding:24px;overflow-y:auto}
  .card{width:100%;max-width:380px;text-align:center}
  .kicker{font-family:var(--display);font-size:11px;letter-spacing:.36em;
    text-transform:uppercase;color:var(--amber)}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(46px,15vw,74px);
    letter-spacing:.02em;text-transform:uppercase;line-height:.88;margin:10px 0 14px}
  h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,10vw,46px);
    letter-spacing:.03em;text-transform:uppercase;line-height:1;margin:10px 0 12px}
  .body{font-size:13px;line-height:1.65;opacity:.72;max-width:300px;margin:0 auto}
  .stats{display:flex;justify-content:center;gap:26px;margin:20px 0 4px}
  .stat b{display:block;font-family:var(--display);font-size:26px;letter-spacing:.03em}
  .stat span{font-size:9px;letter-spacing:.24em;text-transform:uppercase;opacity:.5}
  button{font-family:var(--display);text-transform:uppercase;letter-spacing:.18em;
    border-radius:2px;cursor:pointer;color:var(--ink);background:var(--amber);
    border:none;font-size:15px;padding:15px 34px;margin-top:26px;font-weight:600}
  button.ghost{background:transparent;color:var(--bone);border:1px solid rgba(237,230,218,.28);
    font-size:12px;padding:12px 22px;margin-top:12px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  #levelPips{display:flex;gap:6px;justify-content:center;margin-top:22px}
  .pip{width:22px;height:2px;background:rgba(237,230,218,.22)}
  .pip.done{background:var(--amber)}
  .toggle{margin-top:16px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    opacity:.55;cursor:pointer;display:inline-block;border-bottom:1px dotted rgba(237,230,218,.4);
    padding-bottom:2px}
  .toggles{display:flex;flex-direction:column;align-items:center;gap:2px}
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<div id="hud">
  <div id="telemetry" class="hidden">

      <path d="M-56 0 A56 56 0 0 1 56 0" fill="none" stroke="rgba(237,230,218,.22)" stroke-width="1"/>
      <g stroke="rgba(237,230,218,.35)" stroke-width="1">
        <line x1="0" y1="-56" x2="0" y2="-48"/>
        <line x1="-39.6" y1="-39.6" x2="-34" y2="-34"/>
        <line x1="39.6" y1="-39.6" x2="34" y2="-34"/>
        <line x1="-56" y1="0" x2="-49" y2="0"/>
        <line x1="56" y1="0" x2="49" y2="0"/>
      </g>
      <g id="bankNeedle"><polygon points="0,-52 -5,-43 5,-43" fill="#f5c45e"/></g>
      <g id="ladder">
        <line x1="-26" y1="0" x2="26" y2="0" stroke="#f5c45e" stroke-width="1.4" opacity=".9"/>
        <line x1="-16" y1="-14" x2="16" y2="-14" stroke="rgba(237,230,218,.4)" stroke-width="1"/>
        <line x1="-16" y1="14" x2="16" y2="14" stroke="rgba(237,230,218,.4)" stroke-width="1"/>

    <svg id="launchTrajSvg"><path id="launchTrajPath" fill="none" stroke="#f5c45e" stroke-width="3"
      stroke-linecap="round" opacity="0.9"/></svg>
    <div id="launchPad"></div>

      <div id="launchBar" class="meterBar"><div id="launchFill" class="meterFill"></div></div>
    </div>

  <div id="vignette"></div>

  <div id="panel"><div class="card" id="card"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   LEVELS  — selectable glide biomes. Each `env` drives terrain
   styling, decoration and sky. Distances in metres, speeds in m/s.

   `length` is the distance a single run must reach to unlock the
   next biome (no longer a fixed sector length — runs end on crash).
   `speed` is flavour text only (shown on biome-select), no longer a
   live cruise target. `hw/hwv/wallH/cave/caveH` shape obstacle
   spawning and decoration only — there are no walls/ceiling to
   collide with in the open-glide loop.
   env: canyon | mountain | space | volcanic | ice
   ============================================================ */
const LEVELS = [
  { name:"Ochre Run", env:"canyon", seed:1137,
    length:2100, speed:56, hw:34, hwv:5, wallH:135,
    a1:45, f1:0.0050, a2:15, f2:0.0140, a3:12, f3:0.0090, a4:5, f4:0.0210,
    density:0.011, cave:false, caveH:0,
    strata:0.26, capLine:null, capColor:null,
    sky:"#1a1016", horizon:"#4d2a22", fog:0x2b1a1a, fogNear:80, fogFar:520,
    rock:[0.46,0.29,0.20], sun:0xffb98a, sunInt:0.72, hemiInt:0.34,
    motes:{color:0xd8b48c,size:0.6,opacity:0.35,rise:0} },

  { name:"Alpine Reach", env:"mountain", seed:2291,
    length:2600, speed:62, hw:50, hwv:9, wallH:200,
    a1:70, f1:0.0044, a2:24, f2:0.0130, a3:16, f3:0.0085, a4:6, f4:0.0200,
    density:0.017, cave:false, caveH:0,
    strata:0.09, capLine:118, capColor:[0.94,0.96,1.00],
    sky:"#3f7fc4", horizon:"#d3e7f4", fog:0xc2d9ea, fogNear:220, fogFar:1150,
    rock:[0.40,0.43,0.41], sun:0xfff6e2, sunInt:1.15, hemiInt:0.70,
    motes:{color:0xffffff,size:0.7,opacity:0.55,rise:-2} },

  { name:"Orbital Debris", env:"space", seed:3373,
    length:2700, speed:66, hw:32, hwv:5, wallH:165,
    a1:62, f1:0.0058, a2:22, f2:0.0170, a3:14, f3:0.0105, a4:6, f4:0.0240,
    density:0.021, cave:false, caveH:0,
    strata:0.06, capLine:null, capColor:null,
    sky:"#04050c", horizon:"#0e1226", fog:0x06080f, fogNear:180, fogFar:950,
    rock:[0.33,0.32,0.39], sun:0xc4d6ff, sunInt:0.88, hemiInt:0.16,
    stars:true,
    motes:{color:0xbfd4ff,size:0.5,opacity:0.7,rise:0} },

  { name:"Emberwind", env:"volcanic", seed:4457,
    length:2800, speed:68, hw:26, hwv:5, wallH:150,
    a1:66, f1:0.0062, a2:24, f2:0.0190, a3:17, f3:0.0115, a4:7, f4:0.0260,
    density:0.024, cave:true, caveH:56,
    strata:0.32, capLine:null, capColor:null,
    sky:"#2a0b0c", horizon:"#8f2c14", fog:0x3a1108, fogNear:45, fogFar:380,
    rock:[0.36,0.18,0.13], sun:0xff8f52, sunInt:0.62, hemiInt:0.30,
    motes:{color:0xff9d4a,size:0.9,opacity:0.8,rise:9} },

  { name:"Needle's Eye", env:"ice", seed:5531,
    length:2900, speed:72, hw:22, hwv:4, wallH:145,
    a1:70, f1:0.0068, a2:26, f2:0.0210, a3:18, f3:0.0125, a4:8, f4:0.0285,
    density:0.028, cave:true, caveH:50,
    strata:0.36, capLine:34, capColor:[0.86,0.96,1.00],
    sky:"#08161c", horizon:"#2f7280", fog:0x123038, fogNear:45, fogFar:400,
    rock:[0.40,0.55,0.62], sun:0xd8f4ff, sunInt:0.92, hemiInt:0.46,
    motes:{color:0xdff2ff,size:0.6,opacity:0.6,rise:-1} }
];

const PLANE_R      = 2.6;
const YAW_RATE     = 0.85;  // was 1.35 — slowed for a more simulator-like, less twitchy turn (playtest feedback on PR #3)
const PITCH_RATE   = 0.70;  // was 1.05 — see above
const YAW_LIMIT    = 1.00;
const PITCH_LIMIT  = 0.58;
const BOOST_ADD    = 42;   // now an m/s^2 thrust term, not a lerp-target offset — see updateFlight()
const BOOST_DRAIN  = 0.34;
const BOOST_REGEN  = 0.17;

/* ---- glide energy model + slingshot launch (all hand-tuned, flag changes for phone playtesting) ---- */
const GRAVITY_PITCH_COEFF = 18;    // m/s^2 per rad of pitch: diving trades altitude for speed, climbing the reverse
const DRAG_COEFF          = 0.045; // fraction of current speed bled per second
const MIN_SPEED           = 8;
const MAX_SPEED           = 130;
const STALL_SPEED         = 22;    // below this, extra sink kicks in
const STALL_SINK_COEFF    = 0.9;
const LAUNCH_DRAG_R       = 130;   // px, slingshot pull-back radius before power maxes out
const LAUNCH_PITCH_MAX    = PITCH_LIMIT;
const LAUNCH_YAW_MAX      = YAW_LIMIT;
const LAUNCH_MIN_SPEED    = 30;
const LAUNCH_POWER_RANGE  = 55;    // launch speed = LAUNCH_MIN_SPEED..+RANGE based on pull power
const LAUNCH_HEIGHT       = 24;    // m above the floor at the launch pad
const OPEN_FLOOR_PAD      = 180;   // m of floor ribbon either side of the corridor, replaces the old canyon walls
const RUN_BUILD_LENGTH    = 4000;  // m of terrain/obstacles generated per run regardless of biome unlock distance

const SEG          = 4;

/* ============================================================
   STATE
   ============================================================ */
let scene, camera, renderer, clock;
let canyon = null, plane = null, motes = null, debris = null, sky = null;
let sunLight, hemiLight;

const state = {
  mode:"title",
  levelIndex:0,
  unlocked:0,
  z:0, x:0, y:0,
  yaw:0, pitch:0, roll:0,
  speed:0, boostFuel:1, boosting:false,
  time:0, crashes:0, deathTimer:0,
  invertY:true, invertX:true,
  bestDistance:new Array(LEVELS.length).fill(null),
  shake:0,
  launchDragging:false, launchPower:0, launchDx:0, launchDy:0,
  // PR3 prep: upgrade multipliers, applied at launch time — inert (1) until the upgrade shop lands
  dragMul:1, enginePowerMul:1, stallSpeedMul:1
};

const input = { sx:0, sy:0, boost:false, keys:Object.create(null) };

/* ============================================================
   HELPERS
   ============================================================ */
function rng(seed){ let s=seed>>>0; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;

function centerX(z,L){ return Math.sin(z*L.f1)*L.a1 + Math.sin(z*L.f2+1.7)*L.a2; }
function floorY(z,L){ return Math.sin(z*L.f3+0.5)*L.a3 + Math.sin(z*L.f4+2.2)*L.a4; }
function halfWidth(z,L){ return L.hw + Math.sin(z*0.0031+0.9)*L.hwv; }

function fmtTime(t){
  const m=Math.floor(t/60), s=Math.floor(t%60), d=Math.floor((t*10)%10);
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+d;
}

/* ============================================================
   CANYON BUILD
   ============================================================ */
function buildCanyon(L){
  const rand = rng(L.seed);
  const pos=[], col=[];

  // shade: 0 = deep/shadowed, 1 = sunlit top. Strata banding + optional
  // snow/frost cap above capLine gives layered rock cheaply, in vertex colours.
  function push(x,y,z,shade){
    pos.push(x,y,z);
    const band = 0.86 + 0.14*Math.sin(y*L.strata + x*0.012);
    const n = (0.80 + shade*0.38) * band;
    let r=L.rock[0]*n, g=L.rock[1]*n, b=L.rock[2]*n;
    if(L.capLine!==null && y>L.capLine){
      const t=clamp((y-L.capLine)/34,0,1)*0.92;
      r=lerp(r,L.capColor[0],t); g=lerp(g,L.capColor[1],t); b=lerp(b,L.capColor[2],t);
    }
    col.push(r,g,b);
  }
  function quad(a,b,d,e){
    push(a[0],a[1],a[2],a[3]); push(b[0],b[1],b[2],b[3]); push(d[0],d[1],d[2],d[3]);
    push(a[0],a[1],a[2],a[3]); push(d[0],d[1],d[2],d[3]); push(e[0],e[1],e[2],e[3]);
  }

  // Open glide: no walls/ceiling — just a wide floor ribbon. hw+OPEN_FLOOR_PAD keeps the
  // ribbon's edge past the fog/camera range even during hard lateral drift.
  const steps = Math.floor(RUN_BUILD_LENGTH/SEG)+40;
  let prev=null;
  for(let i=0;i<steps;i++){
    const z=i*SEG;
    const cx=centerX(z,L), fy=floorY(z,L), hw=halfWidth(z,L);
    const lx = cx-hw-OPEN_FLOOR_PAD;
    const rx = cx+hw+OPEN_FLOOR_PAD;
    const cur = {z, cx, fy, hw, lx, rx,
                 fl:fy+Math.sin(z*0.09)*0.7, fr:fy+Math.sin(z*0.09+1.3)*0.7};

    if(prev){
      quad([prev.lx,prev.fl,prev.z,0.15],[cur.lx,cur.fl,cur.z,0.15],
           [cur.rx,cur.fr,cur.z,0.25],[prev.rx,prev.fr,prev.z,0.25]);
    }
    prev=cur;
  }

  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute("color",new THREE.Float32BufferAttribute(col,3));
  geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,new THREE.MeshLambertMaterial(
    {vertexColors:true,flatShading:true,side:THREE.DoubleSide}));

  const group=new THREE.Group();
  group.add(mesh);

  /* ---- obstacles (these DO get collision entries) ---- */
  const obstacles=[], bins=new Map();
  const rockMat=new THREE.MeshLambertMaterial({
    color:new THREE.Color(L.rock[0]*0.9,L.rock[1]*0.9,L.rock[2]*0.9), flatShading:true});
  const pillarGeo=new THREE.CylinderGeometry(1,1.35,1,7,1);
  const boulderGeo=new THREE.IcosahedronGeometry(1,0);
  const shardGeo=new THREE.OctahedronGeometry(1,0);
  const obGeo = (L.env==="ice") ? shardGeo : boulderGeo;

  let z=140;
  while(z < RUN_BUILD_LENGTH-90){
    z += 26 + rand()*(1/L.density)*0.55;
    if(z>=RUN_BUILD_LENGTH-90) break;
    const cx=centerX(z,L), fy=floorY(z,L), hw=halfWidth(z,L)+OPEN_FLOOR_PAD;
    const roof = L.cave ? fy + L.caveH : fy + L.wallH;
    const kind = rand();

    if(kind<0.40){                                   // full-height column
      const r = 3.2 + rand()*3.4;
      const px = cx + (rand()*2-1)*(hw-r-6);
      const h  = roof - fy;
      const m=new THREE.Mesh(pillarGeo,rockMat);
      m.scale.set(r,h,r); m.position.set(px,fy+h/2,z); m.rotation.y=rand()*3;
      group.add(m);
      // collar detail — purely visual, sits flush on the column so it can't be clipped
      const collar=new THREE.Mesh(boulderGeo,rockMat);
      collar.scale.set(r*1.5,r*0.7,r*1.5);
      collar.position.set(px,fy+h*(0.25+rand()*0.5),z);
      collar.rotation.set(rand()*3,rand()*3,rand()*3);
      group.add(collar);
      obstacles.push({t:0,x:px,z:z,r:r*1.1,y0:-1e5,y1:1e5});
    } else if(kind<0.70){                            // spire from floor or roof
      const r = 3.0 + rand()*3.0;
      const h = 16 + rand()*26;
      const px = cx + (rand()*2-1)*(hw-r-5);
      const down = L.cave && rand()<0.55;
      const m=new THREE.Mesh(pillarGeo,rockMat);
      if(down){
        m.scale.set(r,h,r); m.position.set(px,roof-h/2,z); m.rotation.z=Math.PI;
        obstacles.push({t:0,x:px,z:z,r:r,y0:roof-h,y1:1e5});
      }else{
        m.scale.set(r,h,r); m.position.set(px,fy+h/2,z);
        obstacles.push({t:0,x:px,z:z,r:r,y0:-1e5,y1:fy+h});
      }
      m.rotation.y=rand()*3;
      group.add(m);
    } else {                                         // floating mass
      const r = 4.0 + rand()*4.0;
      const px = cx + (rand()*2-1)*(hw-r-4);
      const py = fy + 8 + rand()*Math.max(10,(roof-fy)-20);
      const m=new THREE.Mesh(obGeo,rockMat);
      m.scale.set(r,r*0.82,r);
      m.position.set(px,py,z);
      m.rotation.set(rand()*3,rand()*3,rand()*3);
      group.add(m);
      obstacles.push({t:1,x:px,y:py,z:z,r:r});
    }
  }
  for(const o of obstacles){
    const k=Math.floor(o.z/60);
    if(!bins.has(k)) bins.set(k,[]);
    bins.get(k).push(o);
  }

  decorate(group,L,rand);

  group.userData={L,obstacles,bins};
  return group;
}

/* ============================================================
   DECORATION — visual only. Everything here is placed OUTSIDE the
   flight corridor (beyond the wall tops) so it needs no collision
   entry and can never be clipped by the plane.
   ============================================================ */
function decorate(group,L,rand){
  const dark=new THREE.Color(L.rock[0]*0.55,L.rock[1]*0.55,L.rock[2]*0.55);
  const capMat = L.capColor
    ? new THREE.MeshLambertMaterial({color:new THREE.Color(L.capColor[0],L.capColor[1],L.capColor[2]),flatShading:true})
    : null;
  const outerMat=new THREE.MeshLambertMaterial({color:dark,flatShading:true});
  const coneGeo=new THREE.ConeGeometry(1,1,6);
  const rockGeo=new THREE.IcosahedronGeometry(1,0);
  const shardGeo=new THREE.OctahedronGeometry(1,0);

  const step = (L.env==="mountain") ? 110 : 150;
  for(let z=60; z<RUN_BUILD_LENGTH; z+=step*(0.6+rand()*0.8)){
    for(let side=-1; side<=1; side+=2){
      const cx=centerX(z,L), hw=halfWidth(z,L), fy=floorY(z,L);
      const top = fy + L.wallH;
      const base = cx + side*(hw + 40 + rand()*220);

      if(L.env==="mountain"){
        const h=60+rand()*150, r=28+rand()*40;
        const peak=new THREE.Mesh(coneGeo,outerMat);
        peak.scale.set(r,h,r); peak.position.set(base,top+h/2-10,z);
        group.add(peak);
        if(capMat){                                   // snow cap on the top third
          const cap=new THREE.Mesh(coneGeo,capMat);
          cap.scale.set(r*0.42,h*0.34,r*0.42);
          cap.position.set(base,top+h-h*0.17-10,z);
          group.add(cap);
        }
      } else if(L.env==="space"){
        for(let k=0;k<2;k++){                          // drifting asteroid clusters
          const r=6+rand()*22;
          const a=new THREE.Mesh(rockGeo,outerMat);
          a.scale.set(r,r*(0.6+rand()*0.5),r);
          a.position.set(base+(rand()*2-1)*70, top - 40 + rand()*220, z+(rand()*2-1)*90);
          a.rotation.set(rand()*3,rand()*3,rand()*3);
          group.add(a);
        }
      } else if(L.env==="ice"){
        const h=20+rand()*70, r=6+rand()*16;
        const s=new THREE.Mesh(shardGeo,capMat||outerMat);
        s.scale.set(r,h,r); s.position.set(base,top+h*0.3,z);
        s.rotation.y=rand()*3; s.rotation.z=(rand()*2-1)*0.25;
        group.add(s);
      } else {                                         // canyon + volcanic: mesas & boulders
        const h=14+rand()*46, r=14+rand()*34;
        const m=new THREE.Mesh(rockGeo,outerMat);
        m.scale.set(r,h,r); m.position.set(base,top+h*0.25,z);
        m.rotation.set(rand()*0.4,rand()*3,rand()*0.4);
        group.add(m);
      }
    }
  }

  // volcanic: glowing fissures along the canyon floor, flush and non-blocking
  if(L.env==="volcanic"){
    const glow=new THREE.MeshBasicMaterial({color:0xff7a2a,transparent:true,opacity:0.85});
    const stripGeo=new THREE.PlaneGeometry(1,1);
    for(let z=80; z<RUN_BUILD_LENGTH; z+=40+rand()*90){
      const cx=centerX(z,L), fy=floorY(z,L), hw=halfWidth(z,L);
      const p=new THREE.Mesh(stripGeo,glow);
      p.rotation.x=-Math.PI/2;
      p.scale.set(2+rand()*5, 14+rand()*40, 1);
      p.position.set(cx+(rand()*2-1)*hw*0.8, fy+0.35, z);
      p.rotation.z=(rand()*2-1)*0.5;
      group.add(p);
    }
  }
}

/* ============================================================
   PLANE
   ============================================================ */
function buildPlane(){
  const g=new THREE.Group();
  const body=new THREE.MeshLambertMaterial({color:0xede6da,flatShading:true});
  const trim=new THREE.MeshLambertMaterial({color:0xe2574c,flatShading:true});
  const dark=new THREE.MeshLambertMaterial({color:0x3a2e33,flatShading:true});
  const steel=new THREE.MeshLambertMaterial({color:0x8d8a92,flatShading:true});

  const fus=new THREE.Mesh(new THREE.CylinderGeometry(0.78,0.5,6.4,8),body);
  fus.rotation.x=Math.PI/2; g.add(fus);

  const spine=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.3,5.2),trim);
  spine.position.set(0,0.68,-0.4); g.add(spine);

  const nose=new THREE.Mesh(new THREE.ConeGeometry(0.78,1.9,8),trim);
  nose.rotation.x=Math.PI/2; nose.position.z=4.1; g.add(nose);
  const probe=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1.5,4),steel);
  probe.rotation.x=Math.PI/2; probe.position.z=5.6; g.add(probe);

  const canopy=new THREE.Mesh(new THREE.SphereGeometry(0.62,8,6),dark);
  canopy.scale.set(1,0.7,1.7); canopy.position.set(0,0.5,0.9); g.add(canopy);

  const wing=new THREE.Mesh(new THREE.BoxGeometry(9.6,0.24,2.1),body);
  wing.position.z=0.2; g.add(wing);
  const inner=new THREE.Mesh(new THREE.BoxGeometry(4.4,0.3,2.6),body);
  inner.position.z=0.1; g.add(inner);

  const wtipL=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.5,1.5),trim);
  wtipL.position.set(-4.8,0.1,0.2); g.add(wtipL);
  const wtipR=wtipL.clone(); wtipR.position.x=4.8; g.add(wtipR);

  // nav lights — port red, starboard green, as on a real airframe
  const navL=new THREE.Mesh(new THREE.SphereGeometry(0.2,6,5),
    new THREE.MeshBasicMaterial({color:0xe2574c}));
  navL.position.set(-5.15,0.12,0.2); g.add(navL);
  const navR=new THREE.Mesh(new THREE.SphereGeometry(0.2,6,5),
    new THREE.MeshBasicMaterial({color:0x5fd08a}));
  navR.position.set(5.15,0.12,0.2); g.add(navR);

  const podL=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.34,2.4,6),steel);
  podL.rotation.x=Math.PI/2; podL.position.set(-2.5,-0.28,0.4); g.add(podL);
  const podR=podL.clone(); podR.position.x=2.5; g.add(podR);

  const tail=new THREE.Mesh(new THREE.BoxGeometry(3.4,0.2,1.3),body);
  tail.position.z=-2.8; g.add(tail);
  const fin=new THREE.Mesh(new THREE.BoxGeometry(0.2,1.7,1.5),trim);
  fin.position.set(0,0.85,-2.9); g.add(fin);
  const finTip=new THREE.Mesh(new THREE.BoxGeometry(0.26,0.3,0.7),body);
  finTip.position.set(0,1.62,-3.1); g.add(finTip);

  const ring=new THREE.Mesh(new THREE.CylinderGeometry(0.56,0.56,0.3,8),steel);
  ring.rotation.x=Math.PI/2; ring.position.z=-3.35; g.add(ring);

  const flame=new THREE.Mesh(new THREE.ConeGeometry(0.5,2.4,7),
    new THREE.MeshBasicMaterial({color:0xf5c45e,transparent:true,opacity:0.85}));
  flame.rotation.x=-Math.PI/2; flame.position.z=-4.2; flame.name="flame"; g.add(flame);

  return g;
}

/* ============================================================
   PARTICLES
   ============================================================ */
function buildMotes(){
  const n=460, p=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    p[i*3]  =(Math.random()*2-1)*70;
    p[i*3+1]=(Math.random()*2-1)*50;
    p[i*3+2]=Math.random()*320-60;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(p,3));
  return new THREE.Points(g,new THREE.PointsMaterial(
    {color:0xede6da,size:0.6,transparent:true,opacity:0.4,depthWrite:false}));
}

function buildDebris(){
  const n=90, p=new Float32Array(n*3);
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(p,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial(
    {color:0xf5c45e,size:1.5,transparent:true,opacity:1,depthWrite:false}));
  pts.visible=false;
  pts.userData.vel=new Float32Array(n*3);
  return pts;
}

function burst(x,y,z){
  const p=debris.geometry.attributes.position.array, v=debris.userData.vel;
  for(let i=0;i<p.length;i+=3){
    p[i]=x; p[i+1]=y; p[i+2]=z;
    v[i]=(Math.random()*2-1)*26; v[i+1]=(Math.random()*2-1)*26; v[i+2]=(Math.random()*2-1)*26;
  }
  debris.geometry.attributes.position.needsUpdate=true;
  debris.visible=true; debris.material.opacity=1;
}

/* ============================================================
   SKY — dome, plus stars / sun disc per environment
   ============================================================ */
function buildSky(L){
  const grp=new THREE.Group();

  const dome=new THREE.Mesh(new THREE.SphereGeometry(1500,18,12),new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{ top:{value:new THREE.Color(L.sky)}, bottom:{value:new THREE.Color(L.horizon)} },
    vertexShader:"varying float h; void main(){ h=normalize(position).y; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
    fragmentShader:"varying float h; uniform vec3 top; uniform vec3 bottom; void main(){ gl_FragColor=vec4(mix(bottom,top,clamp(h*1.4+0.25,0.0,1.0)),1.0); }"
  }));
  grp.add(dome);

  if(L.stars){
    const n=900, p=new Float32Array(n*3);
    for(let i=0;i<n;i++){
      const th=Math.random()*Math.PI*2, ph=Math.acos(Math.random()*2-1), r=1300;
      p[i*3]  =r*Math.sin(ph)*Math.cos(th);
      p[i*3+1]=r*Math.cos(ph);
      p[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    }
    const sg=new THREE.BufferGeometry();
    sg.setAttribute("position",new THREE.BufferAttribute(p,3));
    grp.add(new THREE.Points(sg,new THREE.PointsMaterial(
      {color:0xffffff,size:5,sizeAttenuation:false,transparent:true,opacity:0.9,depthWrite:false,fog:false})));

    const planet=new THREE.Mesh(new THREE.SphereGeometry(150,20,16),
      new THREE.MeshBasicMaterial({color:0x5d6ea8,fog:false}));
    planet.position.set(-700,320,900);
    grp.add(planet);
  }

  if(L.env==="mountain"){
    const sun=new THREE.Mesh(new THREE.SphereGeometry(58,16,12),
      new THREE.MeshBasicMaterial({color:0xfff8e4,fog:false}));
    sun.position.set(-520,520,900);
    grp.add(sun);
    const halo=new THREE.Mesh(new THREE.SphereGeometry(105,16,12),
      new THREE.MeshBasicMaterial({color:0xfff1cc,transparent:true,opacity:0.18,fog:false}));
    halo.position.copy(sun.position);
    grp.add(halo);
  }

  return grp;
}

/* ============================================================
   INIT
   ============================================================ */
function init(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(72,window.innerWidth/window.innerHeight,0.5,2400);
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
  renderer.setSize(window.innerWidth,window.innerHeight);
  document.body.insertBefore(renderer.domElement,document.getElementById("hud"));

  hemiLight=new THREE.HemisphereLight(0xffffff,0x2a1a1a,0.55); scene.add(hemiLight);
  sunLight=new THREE.DirectionalLight(0xffd9a8,0.95);
  sunLight.position.set(-0.4,1,0.3); scene.add(sunLight);

  motes=buildMotes(); scene.add(motes);
  debris=buildDebris(); scene.add(debris);
  plane=buildPlane(); scene.add(plane);

  clock=new THREE.Clock();
  window.addEventListener("resize",onResize);
  bindControls();
  showTitle();
  renderer.setAnimationLoop(tick);
}

function onResize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
}

/* ============================================================
   LEVEL LIFECYCLE
   ============================================================ */
function applyEnvironment(L){
  scene.fog=new THREE.Fog(L.fog,L.fogNear,L.fogFar);
  sunLight.color.setHex(L.sun);
  sunLight.intensity=L.sunInt;
  hemiLight.intensity=L.hemiInt;
  hemiLight.groundColor.setHex(L.fog);
  motes.material.color.setHex(L.motes.color);
  motes.material.size=L.motes.size;
  motes.material.opacity=L.motes.opacity;
  motes.userData.rise=L.motes.rise;
  document.querySelector("meta[name=theme-color]").setAttribute("content",L.sky);
}

function loadBiomeScene(i){
  const L=LEVELS[i];
  if(canyon){ scene.remove(canyon); disposeGroup(canyon); }
  if(sky){ scene.remove(sky); disposeGroup(sky); }
  sky=buildSky(L); scene.add(sky);
  canyon=buildCanyon(L); scene.add(canyon);
  applyEnvironment(L);
  return L;
}

function enterLaunch(i){
  state.levelIndex=i;
  const L=loadBiomeScene(i);

  state.z=0; state.x=centerX(0,L); state.y=floorY(0,L)+LAUNCH_HEIGHT;
  state.yaw=0; state.pitch=0; state.roll=0;
  state.speed=0; state.boostFuel=1; state.time=0; state.deathTimer=0; state.shake=0;
  state.launchDragging=false; state.launchPower=0; state.launchDx=0; state.launchDy=0;
  debris.visible=false;
  plane.visible=true;
  plane.position.set(state.x,state.y,state.z);
  plane.rotation.set(0,0,0);
  placeCamera(true);

  document.getElementById("levelNum").textContent=String(i+1).padStart(2,"0");
  document.getElementById("levelName").textContent=L.name;
  state.mode="launch";
  showHUD(false);
  $("launchZone").classList.remove("hidden");
  setLaunchVisuals();
  hidePanel();
}

function releaseLaunch(){
  state.speed=clamp((LAUNCH_MIN_SPEED+state.launchPower*LAUNCH_POWER_RANGE)*state.enginePowerMul, MIN_SPEED, MAX_SPEED);
  state.boostFuel=1; state.time=0; state.deathTimer=0; state.shake=0;
  state.launchDragging=false; state.launchPower=0; state.launchDx=0; state.launchDy=0;
  $("launchZone").classList.add("hidden");
  state.mode="flying";
  showHUD(true);
}

// Draws the pull-back trajectory preview as a curved line anchored at the launch pad,
// regardless of drag angle (a straight div rotated+translated in CSS drifted off the
// pad center at most angles — see PR #3 review). The curve bows upward like a simple
// arc preview; it's a stylised aim indicator, not a physically projected flight path.
function setLaunchVisuals(){
  const padX=window.innerWidth*0.5, padY=window.innerHeight*0.6;
  const endX=padX+state.launchDx, endY=padY+state.launchDy;
  const midX=(padX+endX)/2, midY=(padY+endY)/2;
  const bow=Math.hypot(state.launchDx,state.launchDy)*0.4;
  $("launchTrajPath").setAttribute("d",
    "M "+padX.toFixed(1)+" "+padY.toFixed(1)+
    " Q "+midX.toFixed(1)+" "+(midY-bow).toFixed(1)+" "+endX.toFixed(1)+" "+endY.toFixed(1));
  $("launchFill").style.width=(state.launchPower*100).toFixed(0)+"%";
}

function disposeGroup(g){
  g.traverse(function(o){
    if(o.geometry) o.geometry.dispose();
    if(o.material){ Array.isArray(o.material)?o.material.forEach(m=>m.dispose()):o.material.dispose(); }
  });
}

/* ============================================================
   FLIGHT
   ============================================================ */
function forwardVec(yaw,pitch,out){
  const cp=Math.cos(pitch);
  out.set(Math.sin(yaw)*cp, Math.sin(pitch), Math.cos(yaw)*cp);
  return out;
}
const _fwd=new THREE.Vector3(), _tmp=new THREE.Vector3(), _look=new THREE.Vector3();

function placeCamera(snap){
  const back=18, up=6.2;
  forwardVec(state.yaw, state.pitch*0.45, _fwd);
  _tmp.set(state.x,state.y,state.z).addScaledVector(_fwd,-back);
  _tmp.y += up;
  if(snap) camera.position.copy(_tmp); else camera.position.lerp(_tmp,0.16);
  forwardVec(state.yaw, state.pitch, _fwd);
  _look.set(state.x,state.y,state.z).addScaledVector(_fwd,26);
  camera.up.set(Math.sin(state.roll)*0.35,1,0);
  camera.lookAt(_look);
}

function updateFlight(dt){
  let sx=input.sx, sy=input.sy;
  if(input.keys["ArrowLeft"]||input.keys["a"]) sx=-1;
  if(input.keys["ArrowRight"]||input.keys["d"]) sx=1;
  if(input.keys["ArrowUp"]||input.keys["w"]) sy=1;
  if(input.keys["ArrowDown"]||input.keys["s"]) sy=-1;
  const wantBoost = input.boost || !!input.keys["Shift"];

  // Axis inversion applied once, up front — roll follows the inverted sx so
  // the plane always banks into the turn it's actually making.
  if(state.invertY) sy=-sy;
  if(state.invertX) sx=-sx;

  state.yaw   = clamp(state.yaw   + sx*YAW_RATE*dt,  -YAW_LIMIT, YAW_LIMIT);
  state.pitch = clamp(state.pitch + sy*PITCH_RATE*dt,-PITCH_LIMIT,PITCH_LIMIT);
  // Auto-center and bank lerps slowed to match the calmer yaw/pitch rates above.
  if(Math.abs(sy)<0.08) state.pitch = lerp(state.pitch,0,1.1*dt);
  if(Math.abs(sx)<0.08) state.yaw   = lerp(state.yaw,0,0.55*dt);

  state.roll = lerp(state.roll, -sx*0.95, 4.5*dt);

  state.boosting = wantBoost && state.boostFuel>0.02;
  state.boostFuel = clamp(state.boostFuel + (state.boosting?-BOOST_DRAIN:BOOST_REGEN)*dt, 0, 1);

  // Energy-based glide: pitch trades speed for altitude (and vice versa), drag bleeds
  // speed continuously, boost is direct thrust, and stalling below STALL_SPEED adds sink.
  state.speed += -GRAVITY_PITCH_COEFF*Math.sin(state.pitch)*dt;
  state.speed -= DRAG_COEFF*state.dragMul*state.speed*dt;
  if(state.boosting) state.speed += BOOST_ADD*state.enginePowerMul*dt;
  const stallSpeed = STALL_SPEED*state.stallSpeedMul;
  if(state.speed<stallSpeed) state.speed -= (stallSpeed-state.speed)*STALL_SINK_COEFF*dt;
  state.speed = clamp(state.speed, MIN_SPEED, MAX_SPEED);

  forwardVec(state.yaw,state.pitch,_fwd);
  state.x += _fwd.x*state.speed*dt;
  state.y += _fwd.y*state.speed*dt;
  state.z += _fwd.z*state.speed*dt;

  plane.position.set(state.x,state.y,state.z);
  plane.rotation.set(0,0,0);
  plane.rotateY(state.yaw);
  plane.rotateX(-state.pitch);
  plane.rotateZ(state.roll);
  const flame=plane.getObjectByName("flame");
  flame.scale.set(1, state.boosting?1.9+Math.random()*0.4:0.9+Math.random()*0.2, 1);

  state.time += dt;
}

function checkCollision(){
  const L=LEVELS[state.levelIndex];
  const fy=floorY(state.z,L);
  const below = state.y - (fy+PLANE_R);

  let clearance = below;
  if(below<0) return {hit:true, clearance:0};

  const k=Math.floor(state.z/60);
  for(let b=k-1;b<=k+1;b++){
    const arr=canyon.userData.bins.get(b);
    if(!arr) continue;
    for(let i=0;i<arr.length;i++){
      const o=arr[i];
      const dx=state.x-o.x, dz=state.z-o.z;
      if(o.t===0){
        const d=Math.sqrt(dx*dx+dz*dz)-(o.r+PLANE_R);
        if(state.y>o.y0 && state.y<o.y1){
          if(d<0) return {hit:true, clearance:0};
          clearance=Math.min(clearance,d);
        }
      } else {
        const dy=state.y-o.y;
        const d=Math.sqrt(dx*dx+dy*dy+dz*dz)-(o.r+PLANE_R);
        if(d<0) return {hit:true, clearance:0};
        clearance=Math.min(clearance,d);
      }
    }
  }
  return {hit:false, clearance:clearance};
}

/* ============================================================
   LOOP
   ============================================================ */
function tick(){
  const dt=Math.min(clock.getDelta(),0.05);

  if(state.mode==="flying"){
    updateFlight(dt);
    const c=checkCollision();
    if(c.hit){
      crash();
    }else{
      updateHUD(c.clearance);
      const L=LEVELS[state.levelIndex];
      if(state.z>=L.length) finishRun();
    }
  } else if(state.mode==="launch"){
    if(state.launchDragging) setLaunchVisuals();
  } else if(state.mode==="crashed"){
    state.deathTimer+=dt;
    state.shake=Math.max(0,state.shake-dt*2.2);
    if(state.deathTimer>0.95 && !document.getElementById("panel").dataset.shown) showResults();
  } else if(state.mode==="title"){
    state.z += 26*dt;
    if(canyon){
      const L=LEVELS[state.levelIndex];
      state.x=centerX(state.z,L); state.y=floorY(state.z,L)+(L.cave?L.caveH*0.5:28);
      plane.position.set(state.x,state.y,state.z);
      plane.rotation.set(0,0,0);
      if(state.z>L.length-200) state.z=0;
    }
  }

  if(state.mode==="crashed"){
    camera.position.x += (Math.random()*2-1)*state.shake*1.4;
    camera.position.y += (Math.random()*2-1)*state.shake*1.4;
    _look.set(state.x,state.y,state.z);
    camera.lookAt(_look);
  }else if(state.mode!=="launch"){
    // Camera holds the static establishing shot set on entering "launch" (see enterLaunch)
    // while aiming — it only starts panning/following again once flight actually begins.
    placeCamera(false);
  }

  if(sky) sky.position.copy(camera.position);

  const mp=motes.geometry.attributes.position.array;
  const rise=motes.userData.rise||0;
  for(let i=0;i<mp.length;i+=3){
    if(rise!==0){
      mp[i+1]+=rise*dt;
      if(mp[i+1]>50) mp[i+1]=-50; else if(mp[i+1]<-50) mp[i+1]=50;
    }
    if(mp[i+2] + motes.position.z < camera.position.z-40) mp[i+2]+=340;
  }
  motes.position.set(state.x,state.y,Math.floor(state.z/340)*340);
  motes.geometry.attributes.position.needsUpdate=true;

  if(debris.visible){
    const p=debris.geometry.attributes.position.array, v=debris.userData.vel;
    for(let i=0;i<p.length;i+=3){
      p[i]+=v[i]*dt; p[i+1]+=v[i+1]*dt-9*dt; p[i+2]+=v[i+2]*dt;
    }
    debris.geometry.attributes.position.needsUpdate=true;
    debris.material.opacity=Math.max(0,debris.material.opacity-dt*0.5);
    if(debris.material.opacity<=0) debris.visible=false;
  }

  renderer.render(scene,camera);
}

/* ============================================================
   EVENTS
   ============================================================ */
function crash(){
  if(state.mode!=="flying") return;
  state.mode="crashed"; state.crashes++; state.deathTimer=0; state.shake=1;
  const i=state.levelIndex;
  if(state.bestDistance[i]===null || state.z>state.bestDistance[i]) state.bestDistance[i]=state.z;
  burst(state.x,state.y,state.z);
  plane.visible=false;
  showHUD(false);
  navigator.vibrate && navigator.vibrate(90);
}

// Reaching a biome's target distance without crashing ends the run cleanly — unlocks the
// next biome and shows results immediately (no death-timer delay, this isn't a wreck).
function finishRun(){
  if(state.mode!=="flying") return;
  state.mode="finished";
  const i=state.levelIndex;
  if(state.unlocked<=i) state.unlocked=i+1;
  if(state.bestDistance[i]===null || state.z>state.bestDistance[i]) state.bestDistance[i]=state.z;
  showHUD(false);
  showResults();
}

/* ============================================================
   UI
   ============================================================ */
const $=id=>document.getElementById(id);
const panel=$("panel"), card=$("card");

function showHUD(on){
  ["telemetry","attitude","rail","speedBox","stickZone","boost"].forEach(function(id){
    $(id).classList.toggle("hidden",!on);
  });
  if(!on) $("vignette").style.opacity=0;
}

function hidePanel(){ panel.classList.add("hidden"); delete panel.dataset.shown; }
function openPanel(html){
  card.innerHTML=html;
  panel.classList.remove("hidden");
  panel.dataset.shown="1";
}

function pips(){
  let h='<div id="levelPips">';
  for(let i=0;i<LEVELS.length;i++) h+='<div class="pip'+(i<state.unlocked?" done":"")+'"></div>';
  return h+"</div>";
}

function pitchLabel(){ return "Pitch: "+(state.invertY?"Pull back to climb":"Push forward to climb"); }
function steerLabel(){ return "Steer: "+(state.invertX?"Push left to turn right":"Push right to turn right"); }

function toggleBlock(suffix){
  return '<div class="toggles">'+
    '<span class="toggle" id="btnInvertY'+suffix+'">'+pitchLabel()+'</span>'+
    '<span class="toggle" id="btnInvertX'+suffix+'">'+steerLabel()+'</span></div>';
}
function wireToggles(suffix){
  $("btnInvertY"+suffix).onclick=function(){ state.invertY=!state.invertY; this.textContent=pitchLabel(); };
  $("btnInvertX"+suffix).onclick=function(){ state.invertX=!state.invertX; this.textContent=steerLabel(); };
}

function showTitle(){
  state.mode="title";
  if(!canyon){
    loadBiomeScene(0);
    state.levelIndex=0; state.z=200; state.yaw=0; state.pitch=0;
  }
  plane.visible=true;
  showHUD(false);
  openPanel(
    '<div class="kicker">Low & Fast</div>'+
    '<h1>Canyon<br>Runner</h1>'+
    '<p class="body">Pull back and launch into open sky. Dive to gain speed, climb to trade it for altitude, and glide as far as you can before you go down. Push far enough into a biome to unlock the next.</p>'+
    '<button id="btnStart">Choose a biome</button>'+
    toggleBlock("A")+
    pips()+
    '<div class="row"><button class="ghost" id="btnShop" disabled>Hangar (coming soon)</button></div>'
  );
  $("btnStart").onclick=()=>showSelect();
  wireToggles("A");
}

function showResults(){
  const L=LEVELS[state.levelIndex], i=state.levelIndex;
  const dist=Math.round(state.z), best=Math.round(state.bestDistance[i]);
  const clean = state.mode==="finished";
  const justUnlocked = state.unlocked===i+1 && state.z>=L.length;
  openPanel(
    '<div class="kicker">'+L.name+'</div>'+
    '<h2>'+(clean?"Biome Cleared":"Wreckage")+'</h2>'+
    '<p class="body">'+(clean
      ? "You crossed the line at "+dist+"m."+(justUnlocked?" Next biome unlocked.":"")
      : "You covered "+dist+"m before impact."+(justUnlocked?" Far enough to unlock the next biome.":""))+
      '</p>'+
    '<div class="stats">'+
      '<div class="stat"><b>'+dist+'m</b><span>Distance</span></div>'+
      '<div class="stat"><b>'+best+'m</b><span>Best</span></div>'+
      '<div class="stat"><b>'+state.crashes+'</b><span>Wrecks</span></div>'+
      // PR2 TODO: append a fourth .stat block here — coins earned = floor(distance/COIN_DISTANCE_DIVISOR), plus running total from state.coins
    '</div>'+
    '<button id="btnRetry">Fly again</button>'+
    '<div class="row"><button class="ghost" id="btnMenu">Change biome</button></div>'
  );
  $("btnRetry").onclick=()=>enterLaunch(state.levelIndex);
  $("btnMenu").onclick=()=>{ plane.visible=true; showSelect(); };
}

function showSelect(){
  state.mode="title";
  let rows="";
  for(let i=0;i<LEVELS.length;i++){
    const open=i<=state.unlocked, dist=state.bestDistance[i];
    rows+='<button class="ghost" data-lv="'+i+'"'+(open?"":' disabled style="opacity:.3"')+'>'+
      String(i+1).padStart(2,"0")+" "+LEVELS[i].name+
      (open ? (dist!==null?" · "+Math.round(dist)+"m":"") : " · unlock at "+LEVELS[i-1].length+"m")+
      '</button>';
  }
  openPanel(
    '<div class="kicker">Choose a biome</div>'+
    '<h2>Flight Plan</h2>'+
    '<div class="row" style="flex-direction:column;align-items:stretch;margin-top:18px">'+rows+'</div>'+
    toggleBlock("B")
  );
  card.querySelectorAll("button[data-lv]").forEach(function(b){
    b.onclick=()=>enterLaunch(parseInt(b.dataset.lv,10));
  });
  wireToggles("B");
}

function updateHUD(clearance){
  const L=LEVELS[state.levelIndex];
  $("clock").textContent=fmtTime(state.time);
  $("speed").textContent=Math.round(state.speed*3.6);
  $("boostFill").style.width=(state.boostFuel*100).toFixed(0)+"%";
  $("boost").classList.toggle("on",state.boosting);
  $("boost").classList.toggle("dry",state.boostFuel<0.05);

  const pct=clamp(state.z/L.length,0,1);
  $("railFill").style.height=(pct*100)+"%";
  $("railHead").style.bottom=(pct*100)+"%";
  $("railHead").textContent=Math.round(pct*100)+"%";

  $("bankNeedle").setAttribute("transform","rotate("+(state.roll*57.3).toFixed(1)+")");
  $("ladder").setAttribute("transform",
    "translate(0,"+(state.pitch*57.3*0.9).toFixed(1)+") rotate("+(-state.roll*57.3).toFixed(1)+")");

  const danger=clamp(1-(clearance/16),0,1);
  $("vignette").style.opacity=(danger*danger*0.85).toFixed(2);
}

/* ============================================================
   INPUT
   ============================================================ */
function bindControls(){
  const zone=$("stickZone"), base=$("stickBase"), knob=$("stickKnob");
  let sid=null, cx=0, cy=0;
  const R=52;

  function setKnob(dx,dy){ knob.style.transform="translate("+dx+"px,"+dy+"px)"; }
  zone.addEventListener("pointerdown",function(e){
    if(sid!==null) return;
    sid=e.pointerId;
    const r=base.getBoundingClientRect();
    cx=r.left+r.width/2; cy=r.top+r.height/2;
    zone.setPointerCapture(sid);
    move(e);
  });
  function move(e){
    if(e.pointerId!==sid) return;
    let dx=e.clientX-cx, dy=e.clientY-cy;
    const d=Math.hypot(dx,dy);
    if(d>R){ dx=dx/d*R; dy=dy/d*R; }
    setKnob(dx,dy);
    input.sx=clamp(dx/R,-1,1);
    input.sy=clamp(-dy/R,-1,1);
  }
  zone.addEventListener("pointermove",move);
  function end(e){
    if(e.pointerId!==sid) return;
    sid=null; input.sx=0; input.sy=0; setKnob(0,0);
  }
  zone.addEventListener("pointerup",end);
  zone.addEventListener("pointercancel",end);

  const b=$("boost");
  b.addEventListener("pointerdown",e=>{ e.preventDefault(); input.boost=true; });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>
    b.addEventListener(ev,()=>{ input.boost=false; }));

  // Slingshot launch: drag anywhere on #launchZone (visible only in "launch" mode).
  // Pulling down/back aims the climb angle, dragging sideways aims yaw, pull
  // distance sets launch power — release fires releaseLaunch().
  const lz=$("launchZone");
  let lid=null, lox=0, loy=0;
  lz.addEventListener("pointerdown",function(e){
    if(lid!==null) return;
    lid=e.pointerId; lox=e.clientX; loy=e.clientY;
    lz.setPointerCapture(lid);
    state.launchDragging=true;
  });
  lz.addEventListener("pointermove",function(e){
    if(e.pointerId!==lid) return;
    let dx=e.clientX-lox, dy=e.clientY-loy;
    const d=Math.hypot(dx,dy);
    if(d>LAUNCH_DRAG_R){ dx=dx/d*LAUNCH_DRAG_R; dy=dy/d*LAUNCH_DRAG_R; }
    state.yaw=clamp((dx/LAUNCH_DRAG_R)*LAUNCH_YAW_MAX,-YAW_LIMIT,YAW_LIMIT);
    state.pitch=clamp((dy/LAUNCH_DRAG_R)*LAUNCH_PITCH_MAX,-PITCH_LIMIT,PITCH_LIMIT);
    state.launchPower=clamp(Math.hypot(dx,dy)/LAUNCH_DRAG_R,0,1);
    state.launchDx=dx; state.launchDy=dy;
  });
  function launchEnd(e){
    if(e.pointerId!==lid) return;
    lid=null;
    if(state.mode==="launch" && state.launchDragging) releaseLaunch();
  }
  lz.addEventListener("pointerup",launchEnd);
  lz.addEventListener("pointercancel",launchEnd);

  window.addEventListener("keydown",e=>{
    input.keys[e.key]=true;
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].indexOf(e.key)>-1) e.preventDefault();
  });
  window.addEventListener("keyup",e=>{ input.keys[e.key]=false; });
  document.addEventListener("gesturestart",e=>e.preventDefault());
}

init();
})();
</script>
</body>
</html>
